name: Build containerization template

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      release:
        type: boolean
        description: "Create a release"
        default: false
      version:
        type: string
        description: Version of containerization
        default: test

jobs:
  swift-version:
    name: Determine Swift version
    runs-on: ubuntu-24.04
    outputs:
      image: ${{ steps.version.outputs.image }}
    steps:
      - name: Checkout .swift-version
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8  # v6
        with:
          sparse-checkout: .swift-version
          sparse-checkout-cone-mode: false

      - name: Read Swift version
        id: version
        run: echo "image=swift:$(cat .swift-version)-noble" >> "$GITHUB_OUTPUT"

  # Build the guest initfs (vminitd/vmexec compiled static-musl, then packed
  # into initfs.ext4 + a rootfs tar) inside a GitHub-native Swift Linux
  # container (Docker-backed) — NOT via apple/container, which isn't available
  # on GitHub runners. The macOS job below consumes these as an artifact and
  # creates the vminit:latest image natively with cctl. The container job is
  # unprivileged, so build-initfs.sh uses its `mke2fs -d` fallback (no loop
  # mount / no CAP_SYS_ADMIN needed).
  buildGuest:
    name: Build guest initfs
    needs: swift-version
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    container: ${{ needs.swift-version.outputs.image }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8  # v6
        with:
          fetch-depth: 0

      - name: Check SwiftPM package identities
        run: |
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          ./scripts/check-swiftpm-package-identities.sh

      - name: Install system dependencies
        run: apt-get update && apt-get install -y curl make xz-utils e2fsprogs libarchive-dev libbz2-dev liblzma-dev libssl-dev

      - name: Check formatting
        run: |
          ./scripts/install-hawkeye.sh
          make fmt
          git diff
          if ! git diff --quiet ; then echo the following files require formatting or license headers: ; git diff --name-only ; false ; fi

      - name: Install Static Linux SDK
        run: make -C vminitd linux-sdk

      - name: Build vminitd (static musl, aarch64)
        # Force aarch64 even though this runner is x86_64: the macOS buildAndTest
        # job boots arm64 VZ VMs, so vminitd (PID 1) must be an aarch64 binary or
        # the guest fails to exec and the integration boot hangs. The Static Linux
        # SDK cross-targets both arches from any host (same mechanism dist-x86_64
        # uses in reverse).
        run: make -C vminitd MUSL_ARCH=aarch64 BUILD_CONFIGURATION=${{ inputs.release && 'release' || 'debug' }}

      - name: Build initfs.ext4
        run: ./scripts/build-initfs.sh --vminitd vminitd/bin/vminitd --vmexec vminitd/bin/vmexec --ext4 bin/initfs.ext4 --tar bin/init.rootfs.tar.gz

      - name: Upload guest initfs
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6
        with:
          name: initfs
          path: |
            bin/initfs.ext4
            bin/init.rootfs.tar.gz
          if-no-files-found: error

  buildAndTest:
    name: Build and Test repo
    needs: buildGuest
    timeout-minutes: 60
    runs-on: >-
      ${{ github.repository == 'apple/containerization'
      && fromJSON('["self-hosted", "macos", "tahoe", "ARM64"]') || 'macos-26' }}
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8  # v6
        with:
          fetch-depth: 0

      - name: Check protobufs
        run: |
          make protos
          if ! git diff --quiet ; then echo the following files require formatting or license headers: ; git diff --name-only ; false ; fi

      - name: Make containerization and examples
        run: make clean containerization examples
        env:
          BUILD_CONFIGURATION: ${{ inputs.release && 'release' || 'debug' }}

      - name: Download guest initfs
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7
        with:
          name: initfs
          path: bin

      - name: Make vminit image
        run: |
          make init-image
        env:
          BUILD_CONFIGURATION: ${{ inputs.release && 'release' || 'debug' }}
          VMINIT_IMAGE_SOURCE: https://github.com/${{ github.repository }}

      - name: Test containerization
        timeout-minutes: 15
        run: |
          make test
        env:
          REGISTRY_TOKEN: >-
            ${{ (inputs.release || (github.event_name == 'push'
            && github.ref == 'refs/heads/main')) && github.token || '' }}
          REGISTRY_USERNAME: >-
            ${{ (inputs.release || (github.event_name == 'push'
            && github.ref == 'refs/heads/main')) && github.actor || '' }}

      - name: Test containerization integration
        if: ${{ github.repository == 'apple/containerization' }}
        run: |
          make fetch-default-kernel
          make integration
        env:
          REGISTRY_TOKEN: >-
            ${{ (inputs.release || (github.event_name == 'push'
            && github.ref == 'refs/heads/main')) && github.token || '' }}
          REGISTRY_USERNAME: >-
            ${{ (inputs.release || (github.event_name == 'push'
            && github.ref == 'refs/heads/main')) && github.actor || '' }}

      - name: Create publication image tar
        if: >-
          ${{ (inputs.release && github.repository == 'apple/containerization')
          || (github.repository == 'stephenlclarke/containerization'
          && github.event_name == 'push'
          && (github.ref == 'refs/heads/main'
          || github.ref == 'refs/heads/fix/95-publish-fork-vminit')) }}
        run: |
          bin/cctl images save vminit:latest -o publication-vminit.tar

      - name: Upload publication image
        if: >-
          ${{ (inputs.release && github.repository == 'apple/containerization')
          || (github.repository == 'stephenlclarke/containerization'
          && github.event_name == 'push'
          && (github.ref == 'refs/heads/main'
          || github.ref == 'refs/heads/fix/95-publish-fork-vminit')) }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6
        with:
          name: publication-vminit-${{ github.sha }}
          path: publication-vminit.tar
          if-no-files-found: error

      - name: Create image tar
        if: >-
          ${{ !inputs.release && github.repository == 'apple/containerization' }}
        run: |
          bin/cctl images save vminit:latest -o vminit.tar

      - name: Save vminit artifact
        if: >-
          ${{ !inputs.release && github.repository == 'apple/containerization' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6
        with:
          name: vminit
          path: vminit.tar

  publishVminit:
    name: Publish vminit image
    needs: [buildGuest, buildAndTest]
    if: >-
      ${{ (inputs.release && github.repository == 'apple/containerization')
      || (github.repository == 'stephenlclarke/containerization'
      && github.event_name == 'push'
      && (github.ref == 'refs/heads/main'
      || github.ref == 'refs/heads/fix/95-publish-fork-vminit')) }}
    timeout-minutes: 30
    runs-on: >-
      ${{ github.repository == 'apple/containerization'
      && fromJSON('["self-hosted", "macos", "tahoe", "ARM64"]') || 'macos-26' }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8  # v6
        with:
          fetch-depth: 0

      - name: Build publication client
        run: make clean containerization
        env:
          BUILD_CONFIGURATION: ${{ inputs.release && 'release' || 'debug' }}

      - name: Download publication image
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7
        with:
          name: publication-vminit-${{ github.sha }}

      - name: Load publication image
        run: bin/cctl images load -i publication-vminit.tar

      - name: Push Apple release image
        if: >-
          ${{ inputs.release && github.repository == 'apple/containerization' }}
        env:
          REGISTRY_TOKEN: ${{ github.token }}
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_HOST: ghcr.io
          VERSION: ${{ inputs.version }}
        run: |
          bin/cctl images tag vminit:latest "ghcr.io/apple/containerization/vminit:${VERSION}"
          bin/cctl images push "ghcr.io/apple/containerization/vminit:${VERSION}"

      - name: Publish immutable exact fork image
        if: ${{ github.repository == 'stephenlclarke/containerization' }}
        env:
          REGISTRY_TOKEN: ${{ github.token }}
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_HOST: ghcr.io
          SOURCE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          repository="${GITHUB_REPOSITORY}/vminit"
          image="ghcr.io/${repository}:${SOURCE_SHA}"
          bin/cctl images tag vminit:latest "$image"
          local_digest="$(
            bin/cctl images | awk -v reference="$image" \
              '$1 == reference { print $3 }'
          )"
          if [[ ! "$local_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo 'could not resolve the local exact-image digest' >&2
            exit 1
          fi

          authenticated_token="$(
            curl --fail --silent --show-error \
              --user "${REGISTRY_USERNAME}:${REGISTRY_TOKEN}" \
              "https://ghcr.io/token?service=ghcr.io&scope=repository:${repository}:pull" \
              | jq -er '.token'
          )"
          headers="${RUNNER_TEMP}/vminit-manifest.headers"
          status="$(
            curl --silent --show-error --head --output /dev/null \
              --dump-header "$headers" --write-out '%{http_code}' \
              --header "Authorization: Bearer ${authenticated_token}" \
              --header 'Accept: application/vnd.oci.image.index.v1+json' \
              "https://ghcr.io/v2/${repository}/manifests/${SOURCE_SHA}"
          )"
          case "$status" in
            200)
              remote_digest="$(
                awk 'tolower($1) == "docker-content-digest:" {
                  gsub("\\r", "", $2); print $2
                }' "$headers"
              )"
              if [[ "$remote_digest" != "$local_digest" ]]; then
                printf 'refusing to replace immutable image %s: %s != %s\n' \
                  "$image" "$remote_digest" "$local_digest" >&2
                exit 1
              fi
              ;;
            404)
              bin/cctl images push "$image"
              ;;
            *)
              printf 'could not establish immutable image state: HTTP %s\n' \
                "$status" >&2
              exit 1
              ;;
          esac

          for attempt in {1..12}; do
            anonymous_token=''
            if anonymous_token="$(
                curl --fail --silent --show-error \
                  "https://ghcr.io/token?service=ghcr.io&scope=repository:${repository}:pull" \
                  | jq -er '.token'
              )" \
              && curl --fail --silent --show-error --head \
                --output /dev/null --dump-header "$headers" \
                --header "Authorization: Bearer ${anonymous_token}" \
                --header 'Accept: application/vnd.oci.image.index.v1+json' \
                "https://ghcr.io/v2/${repository}/manifests/${SOURCE_SHA}"; then
              published_digest="$(
                awk 'tolower($1) == "docker-content-digest:" {
                  gsub("\\r", "", $2); print $2
                }' "$headers"
              )"
              if [[ "$published_digest" != "$local_digest" ]]; then
                printf 'published image digest changed: %s != %s\n' \
                  "$published_digest" "$local_digest" >&2
                exit 1
              fi
              exit 0
            fi
            (( attempt < 12 )) || break
            sleep 5
          done
          echo 'exact vminit image did not become anonymously resolvable' >&2
          exit 1
