name: Release containerization

permissions:
  contents: read

on: 
  push: 
    tags:
      - "[0-9]*.[0-9]*.[0-9]*"

jobs: 
  validate-release:
    name: Validate release tag
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout release source
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8  # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require a semantic tag reachable from main
        env:
          RELEASE_REF: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_REF" =~ ^[0-9]+[.][0-9]+[.][0-9]+$ ]]; then
            printf 'Release requires a bare semantic tag: %s\n' "$RELEASE_REF" >&2
            exit 1
          fi
          git fetch --force origin refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            printf 'Release commit is not reachable from origin/main: %s\n' "$GITHUB_SHA" >&2
            exit 1
          fi

  containerization:
    needs: validate-release
    uses: ./.github/workflows/containerization-build-template.yml
    with: 
      release: true
      version: ${{ github.ref_name }}
    secrets: inherit
    permissions:
      contents: read
      packages: write

  codeql:
    name: Run release CodeQL
    needs: containerization
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    permissions:
      actions: read
      contents: write
    steps:
      - name: Dispatch and await release CodeQL
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REF: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          dispatched_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          title="CodeQL release ${RELEASE_REF}"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/dispatches" \
            -f event_type=release-codeql \
            -f "client_payload[release_ref]=${RELEASE_REF}" \
            -f "client_payload[release_sha]=${RELEASE_SHA}"

          run_id=""
          for _ in $(seq 1 60); do
            run_id="$(
              gh run list --repo "$GITHUB_REPOSITORY" \
                --workflow codeql.yml \
                --event repository_dispatch \
                --limit 20 \
                --json databaseId,displayTitle,createdAt |
                jq -r --arg title "$title" --arg since "$dispatched_at" \
                  '[.[] | select(.displayTitle == $title and .createdAt >= $since)] | sort_by(.createdAt) | last | .databaseId // empty'
            )"
            if [[ -n "$run_id" ]]; then
              break
            fi
            sleep 2
          done
          if [[ -z "$run_id" ]]; then
            printf 'Timed out locating CodeQL run for %s\n' "$RELEASE_REF" >&2
            exit 1
          fi
          gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status

  documentation:
    name: Build release documentation
    needs: [codeql, release]
    uses: ./.github/workflows/documentation-build.yml
    secrets: inherit
    permissions:
      contents: read
      pages: write

  deployDocs:
    if: github.repository == 'apple/containerization' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    needs: documentation
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4

  release: 
    if: startsWith(github.ref, 'refs/tags/')
    name: Publish release
    timeout-minutes: 30
    needs: codeql
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: read
    steps:
      - name: Create release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2
        with:
          token: ${{ github.token }}
          name: ${{ github.ref_name }}-prerelease
          draft: true
          make_latest: false
          prerelease: true
          generate_release_notes: true
          fail_on_unmatched_files: true
