name: SonarQube

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sonar-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  swift-version:
    name: Determine Swift version
    if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]')
    runs-on: ubuntu-24.04
    outputs:
      image: ${{ steps.version.outputs.image }}
    steps:
      - name: Check out version at analyzed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .swift-version
          sparse-checkout-cone-mode: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Read Swift version
        id: version
        run: echo "image=swift:$(cat .swift-version)-noble" >> "$GITHUB_OUTPUT"

  linux-coverage:
    name: Instrumented Linux coverage
    needs: swift-version
    if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container: ${{ needs.swift-version.outputs.image }}
    steps:
      - name: Check out analyzed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install system dependencies
        run: apt-get update && apt-get install -y curl make python3 libarchive-dev libbz2-dev liblzma-dev libssl-dev

      - name: Run instrumented Linux tests
        run: swift test --enable-code-coverage --disable-automatic-resolution -Xswiftc -warnings-as-errors

      - name: Export source-bound Linux coverage
        shell: bash
        run: |
          set -euo pipefail
          coverage_dir="$(dirname "$(swift test --show-coverage-path)")"
          profile="${coverage_dir}/default.profdata"
          build_bin="$(swift build --show-bin-path)"
          python3 Tools/coverage/llvm_cov_report.py lcov \
            --build-bin-dir "$build_bin" \
            --profile "$profile" \
            --compilation-dir "$PWD" \
            --output coverage-linux.lcov
          python3 Tools/coverage/lcov-to-sonarqube-generic.py coverage-linux.lcov coverage-linux.xml
          test "$PWD" = "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python3 Tools/coverage/merge-sonarqube-generic.py stamp \
            --repository . --report coverage-linux.xml --output coverage-identity.json

      - name: Upload Linux coverage evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sonar-linux-coverage-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            coverage-linux.lcov
            coverage-linux.xml
            coverage-identity.json
          if-no-files-found: error

  analyze:
    name: Analyze Swift
    needs: linux-coverage
    if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]')
    runs-on: macos-26
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Generate coverage
        run: make coverage-sonar

      - name: Download Linux coverage from this run
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: sonar-linux-coverage-${{ github.event.pull_request.head.sha || github.sha }}
          path: linux-coverage

      - name: Combine exact-source platform coverage
        run: |
          mv coverage.xml coverage-macos.xml
          python3 Tools/coverage/merge-sonarqube-generic.py merge \
            --repository . \
            --mac coverage-macos.xml \
            --linux linux-coverage/coverage-linux.xml \
            --identity linux-coverage/coverage-identity.json \
            --output coverage.xml

      - name: Validate SonarQube project policy
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set -euo pipefail
          settings="$(curl --fail --silent --show-error --user "${SONAR_TOKEN}:" \
            'https://sonarcloud.io/api/settings/values?component=stephenlclarke_containerization&keys=sonar.leak.period,sonar.leak.period.type')"
          jq -e '
            ([.settings[] | select(.key == "sonar.leak.period") | .value] == ["previous_version"])
            and ([.settings[] | select(.key == "sonar.leak.period.type") | .value] == ["previous_version"])
          ' <<< "${settings}" >/dev/null

      - name: Analyze pull request
        if: github.event_name == 'pull_request'
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectVersion=${{ github.event.pull_request.head.sha }}
            -Dsonar.pullrequest.key=${{ github.event.pull_request.number }}
            -Dsonar.pullrequest.branch=${{ github.head_ref }}
            -Dsonar.pullrequest.base=${{ github.base_ref }}
            -Dsonar.qualitygate.wait=true

      - name: Analyze main
        if: github.event_name != 'pull_request' && github.ref_name == 'main'
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectVersion=${{ github.sha }}
            -Dsonar.branch.name=${{ github.ref_name }}
            -Dsonar.qualitygate.wait=true

      - name: Analyze diagnostic branch
        if: github.event_name == 'workflow_dispatch' && github.ref_name != 'main'
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectVersion=${{ github.sha }}
            -Dsonar.branch.name=${{ github.ref_name }}
            -Dsonar.qualitygate.wait=false

      - name: Require clean pull request or main
        if: github.event_name == 'pull_request' || github.ref_name == 'main'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set -euo pipefail
          context=()
          scope=()
          if [[ "${GITHUB_EVENT_NAME}" == 'pull_request' ]]; then
            context+=(--data-urlencode 'pullRequest=${{ github.event.pull_request.number }}')
            scope+=(--data-urlencode 'inNewCodePeriod=true')
          else
            context+=(--data-urlencode "branch=${GITHUB_REF_NAME}")
          fi
          if ((${#scope[@]})); then
            issues="$(curl --fail --silent --show-error --user "${SONAR_TOKEN}:" --get \
              --data-urlencode 'componentKeys=stephenlclarke_containerization' \
              --data-urlencode 'resolved=false' --data-urlencode 'ps=1' \
              "${scope[@]}" "${context[@]}" https://sonarcloud.io/api/issues/search)"
            hotspots="$(curl --fail --silent --show-error --user "${SONAR_TOKEN}:" --get \
              --data-urlencode 'projectKey=stephenlclarke_containerization' \
              --data-urlencode 'status=TO_REVIEW' --data-urlencode 'ps=1' \
              "${scope[@]}" "${context[@]}" https://sonarcloud.io/api/hotspots/search)"
          else
            issues="$(curl --fail --silent --show-error --user "${SONAR_TOKEN}:" --get \
              --data-urlencode 'componentKeys=stephenlclarke_containerization' \
              --data-urlencode 'resolved=false' --data-urlencode 'ps=1' \
              "${context[@]}" https://sonarcloud.io/api/issues/search)"
            hotspots="$(curl --fail --silent --show-error --user "${SONAR_TOKEN}:" --get \
              --data-urlencode 'projectKey=stephenlclarke_containerization' \
              --data-urlencode 'status=TO_REVIEW' --data-urlencode 'ps=1' \
              "${context[@]}" https://sonarcloud.io/api/hotspots/search)"
          fi
          jq -e '.total == 0' <<< "${issues}" >/dev/null
          jq -e '.paging.total == 0' <<< "${hotspots}" >/dev/null

      - name: Upload coverage evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sonar-coverage-${{ github.sha }}
          path: |
            coverage.lcov
            coverage.xml
            coverage-macos.xml
            linux-coverage/coverage-linux.lcov
            linux-coverage/coverage-linux.xml
            linux-coverage/coverage-identity.json
          if-no-files-found: error
